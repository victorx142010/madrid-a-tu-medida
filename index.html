<!DOCTYPE html>
<html>
<head>
    <title>Mapa de Idoneidad Residencial (Resultado MCDA)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.0/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.0/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.0/dist/leaflet.markercluster.js"></script>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="header-bar">
        <button id="menuToggle" class="header-button mobile-only">☰ Filtros</button>
        
        <h1>Madrid a tu medida</h1>
        
        <div style="display: flex; align-items: center;">
             <button id="top10Toggle" class="header-button">Top 10</button>
             <button id="exportButton" class="header-button">Exportar</button>
        </div>
    </div>

    <div class="main-container">
        
        <aside class="sidebar" id="sidebar">
            <button id="closeSidebar" class="close-btn mobile-only">×</button>
            
            <div class="sidebar-section search-section">
                <h4>¿Qué buscas en tu zona ideal?</h4>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="chatInput" placeholder="Ej: Cerca de parques..." style="flex: 1;">
                    <button id="sendButton">></button>
                </div>
                <div id="loader">
                    <div class="spinner"></div> Buscando...
                </div>
                <div id="errorMessage"></div>
            </div>

            <hr>

            <div class="sidebar-section info-section">
                <h4>Análisis Aplicado</h4>
                <div id="info-content">
                    <p style="color: #666; font-size: 0.9em;">
                        Usa el chat de arriba para generar preferencias o espera a que cargue el análisis.
                    </p>
                </div>
            </div>

        </aside>

        <div id="map"></div>
        
        <aside class="sidebar-right" id="sidebarRight">
            <button id="closeSidebarRight" class="close-btn mobile-only" style="position:absolute; top:5px; right:5px; font-size:1.5em; color: white; z-index: 3;">×</button>
            <h4>Top 10 Mejores Zonas</h4>
            <ul id="top10-list" class="top10-list">
                </ul>
        </aside>

    </div>

<script src="js/app.js"></script>
</body>
</html>
